[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brainscope"
dynamic = ["version"]
description = "CT-to-MRI coregistration and semi-automatic localization of intracranial lead contacts (research use only)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nibabel>=5.2",
    "SimpleITK>=2.3",
    "dcm2niix>=1.0.20240202",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pywebview>=5"]

[project.scripts]
brainscope = "brainscope.cli:main"

[tool.setuptools.dynamic]
version = { attr = "brainscope.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainscope = ["web/*", "web/vendor/*", "lead_presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
