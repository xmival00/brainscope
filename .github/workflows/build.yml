# Installers. Run by hand (Actions -> installers -> Run workflow): build and self-test only, nothing is stored.
# Push a tag v*: a draft pre-release is created, each platform uploads its installer straight to it, and it is
# published only when every platform succeeded. No workflow artifacts are kept.
name: installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  PYTHON_VERSION: "3.12"
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "brainscope $GITHUB_REF_NAME (test version)" \
            --notes "Test version. Research use only. The installers are not code-signed: confirm the first start (Windows: More info -> Run anyway; macOS: System Settings -> Privacy & Security -> Open Anyway). Check downloads against SHA256SUMS."

  windows:
    name: Windows x64
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ".[build]"
      - run: pyinstaller --noconfirm --clean packaging/brainscope.spec
      - name: Self-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\brainscope\brainscope.exe -ArgumentList selftest -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with $($p.ExitCode)" }
      - name: Inno Setup (pinned)
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup hash mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $version = (python -c "import brainscope; print(brainscope.__version__)").Trim()
          iscc /DAppVersion=$version /DSourceDir="$PWD\dist\brainscope" /DOutputDir="$PWD\dist" packaging\windows\brainscope.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Compress-Archive -Path dist\brainscope -DestinationPath "dist\brainscope-$version-windows-x64-portable.zip"
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist\*-setup.exe, dist\*-portable.zip | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME $files --repo $env:GITHUB_REPOSITORY

  macos:
    name: macOS ${{ matrix.arch }}
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ".[build]"
      - run: pyinstaller --noconfirm --clean packaging/brainscope.spec
      - name: Self-test the bundle
        run: dist/brainscope.app/Contents/MacOS/brainscope selftest
      - run: packaging/macos/make_dmg.sh
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums, then publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          sha256sum * > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
