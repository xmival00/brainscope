    <g stroke-width="13" stroke-opacity="0.9">
      <path d="M150 176 C176 160 200 184 226 170"/>
      <path d="M124 238 C152 220 178 252 212 236"/>
      <path d="M136 304 C164 286 188 316 222 300"/>
      <path d="M168 360 C188 346 204 368 228 358"/>
      <path d="M362 176 C336 160 312 184 286 170"/>
      <path d="M388 238 C360 220 334 252 300 236"/>
      <path d="M376 304 C348 286 324 316 290 300"/>
      <path d="M344 360 C324 346 308 368 284 358"/>
