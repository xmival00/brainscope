    <rect x="312" y="252" width="20" height="20" rx="5" fill="#ffcf4d"/>
    <rect x="344" y="252" width="20" height="20" rx="5" fill="#ffcf4d"/>
    <rect x="376" y="252" width="20" height="20" rx="5" fill="#ffcf4d"/>
    <rect x="408" y="252" width="20" height="20" rx="5" fill="#ffcf4d"/>
