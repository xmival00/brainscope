<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a3c"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="cortex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7f0"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf4d" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f0b429" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>
  <!-- brain seen from above: two hemispheres with gyri -->
  <g fill="none" stroke="url(#cortex)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="20" d="M246 112 C206 98 160 112 136 146 C106 156 90 190 98 222 C80 246 82 284 102 306
